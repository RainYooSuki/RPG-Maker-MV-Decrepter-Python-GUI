<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 64.0 64.0" role="img" aria-label="RPG Maker MV/MZ Decrypter">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDD8FF"/>
      <stop offset="0.55" stop-color="#8FB4EE"/>
      <stop offset="1" stop-color="#3D91CC"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64.0" height="64.0" rx="13.0"
        fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="63.0" height="63.0" rx="13.0"
        fill="none" stroke="#1E3663" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M 32.0 12.0 L 49.0 18.5 L 49.0 30.0 C 49.0 39.0 43.0 46.0 32.0 54.0 C 21.0 46.0 15.0 39.0 15.0 30.0 L 15.0 18.5 Z" fill="#1E3663"/>
  <!-- Keyhole: head plus stem, cut out of the shield.  A solid light, not the tile
       gradient: sampling the gradient made its contrast depend on where in the tile
       the keyhole sat, which is the one thing that must not vary at small sizes. -->
  <circle cx="32" cy="30.5" r="5.4" fill="#BDD8FF"/>
  <path d="M 29.6 34.0 L 34.4 34.0 L 36.0 44.2 L 28.0 44.2 Z" fill="#BDD8FF"/>
</svg>
